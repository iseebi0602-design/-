<html lang="ja">
<head>

<title>英語はRHYTHM</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#15171a;--muted:#68707a;--line:#e2e5e9;--accent:#2457d6;--good:#18794e;--bad:#c43b3b;--warn:#a56b00;--shadow:0 8px 30px #0000000c}

button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1050px;margin:auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:12px;min-height:48px}.logo{font-weight:850;font-size:19px;letter-spacing:.02em;margin-right:auto}

main{margin-top:10px}.screen{display:none}.screen.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
h1{font-size:25px;margin:4px 0 15px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select,.field input,.field select{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 11px;outline:none}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:var(--bg);border:1px solid var(--line)}.danger{background:#b82e35;color:white}
.drawer{margin-top:16px;border:2px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel)}.drawer>summary{cursor:pointer;list-style:none;padding:15px 16px;font-size:16px;font-weight:800;color:var(--text);background:var(--bg)}.drawer>summary::-webkit-details-marker{display:none}.mistakeDrawerSummary{background:var(--bg)!important;border:2px solid var(--accent);color:var(--text)!important}.drawer>summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--accent);transition:transform .15s ease}.drawer[open]>summary::before{transform:rotate(90deg)}.drawerBody{padding:12px 16px 4px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%}
.dataActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.fileInput{display:none}

.quizTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.progress{font-size:19px;font-weight:850}.end{font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.questionCard{text-align:center;padding:28px 14px 18px}.qLabel{font-size:14px;color:var(--muted);margin-bottom:6px}.question{font-size:clamp(30px,6vw,50px);font-weight:850;line-height:1.25;overflow-wrap:anywhere}.conditionNow{margin-top:12px;font-size:14px;color:var(--muted)}.conditionNow b{color:var(--text);font-size:18px}

.hidden{display:none!important}.sessionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.bigStat{text-align:center;padding:15px;border:1px solid var(--line);border-radius:13px}.bigStat b{display:block;font-size:27px}.mistakeItem{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.mistakeItem:last-child{border-bottom:0}.tag{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;color:var(--muted)}
.datasetCard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:8px}.datasetCard .name{font-weight:800;margin-right:auto}.small{font-size:12px}
.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wordRow{grid-template-columns:42px 1fr 1fr 55px}.wordRow .stat,.wordRow .condition{font-size:11px}.sessionGrid{grid-template-columns:1fr 1fr}.questionCard{padding-top:20px}.question{font-size:34px}}
@media(max-width:450px){.grid{grid-template-columns:1fr}.wordRow{grid-template-columns:38px 1fr 1fr}.wordRow .status{display:none}.choices{gap:8px}.choice{min-height:60px;padding:9px;font-size:14px}.nav button{padding:7px 6px}.logo{font-size:16px}}
.wordRow{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border:0;border-bottom:1px solid var(--line);background:transparent;display:grid;grid-template-columns:60px minmax(130px,1fr) minmax(180px,1.5fr) 38px 120px 80px;gap:8px;align-items:center;padding:11px 8px;min-height:54px}.wordRow:hover{background:var(--hover)}@media(max-width:720px){.wordRow{grid-template-columns:44px 1fr 42px;gap:6px}.wordRow .jp{grid-column:2/-1}.wordRow .stat{display:none}.wordRow .condition{grid-column:2/-1}.wordRow .en{min-width:0;overflow-wrap:anywhere}}
</style>

function datasetHash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function loadDB(){
  try{const x=JSON.parse(localStorage.getItem(KEY)||""); if(x&&x.datasets)return x}catch(e){}
  const id="leap-default";

function current(){return db.datasets[currentDataset]||Object.values(db.datasets)[0]}
function ensureStats(s){
  if(!s.stats) s.stats={};
  return s.stats;
}
function stat(no){
  const s=ensureStats(current()), v=s[no];
  return v||{correct:0,wrong:0,total:0,cond:50,recent:[]};
}
function stateOf(v){
  if(v.total===0)return "？";
  const r=v.recent||[];
  const n=r.length, c=r.filter(Boolean).length;
  if(n===4){
    if(c===4)return "◎"; if(c===3)return "○"; if(c===2)return "△"; return "×";
  }
  if(c===n && n>=2)return "◎";
  if(c>=1 && c/n>=.5)return "○";
  if(c===0)return "×";
  return "△";
}
function recentWrong(v){return (v.recent||[]).filter(x=>!x).length}
function record(no,ok,deltaOverride=null){
  const s=ensureStats(current()), old=stat(no);
  const v={...old,recent:[...(old.recent||[]),ok].slice(-4)};
  v.correct+=ok?1:0; v.wrong+=ok?0:1; v.total++;
  const d=deltaOverride!==null?deltaOverride:(ok?10:-5);
  v.cond=Math.max(0,Math.min(100,(old.cond??50)+d));
  s[no]=v; saveDB();
  cloudSaveWordStats(currentDataset,no,v).catch(e=>console.warn("cloudSaveWordStats",e));
  return {before:old.cond??50,after:v.cond};
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function escape(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function weightedPick(pool,n,priority){
  if(priority==="normal")return shuffle(pool).slice(0,n);
  const scored=pool.map(w=>{
    const v=stat(w.no), weak=(100-(v.cond??50))/100, rw=recentWrong(v)/4;
    const weight=priority==="weak"?1+5*weak:1+5*rw;
    return {w,weight};
  });
  const out=[], bag=[...scored];
  while(out.length<n&&bag.length){
    let total=bag.reduce((a,x)=>a+x.weight,0), r=Math.random()*total, idx=0;
    for(;idx<bag.length;idx++){r-=bag[idx].weight;if(r<=0)break}
    out.push(bag[idx].w);bag.splice(idx,1);
  }
  return out;
}
function makeChoices(w,field){
  const words=current().words.filter(x=>x.no!==w.no);
  const noneCorrect=Math.random()<0.25;
  const wrong=shuffle(words).slice(0,noneCorrect?4:3);
  const choices=noneCorrect?wrong:shuffle([w,...wrong]);
  return {choices,noneCorrect};
}

function diffHtml(a,b){
  // 正しい文字は通常色、余分・間違いは赤。
  // 緑は「入力文字数が正解より少ない」ときの不足文字だけに使う。
  a=String(a); b=String(b);
  const al=a.toLowerCase(), bl=b.toLowerCase();
  const m=al.length, n=bl.length;
  const shorter = m < n;
  const longer = m > n;

  const dp=Array.from({length:m+1},()=>Array(n+1).fill(Infinity));
  dp[m][n]=0;
  for(let i=m;i>=0;i--){
    for(let j=n;j>=0;j--){
      if(i===m && j===n) continue;
      let best=Infinity;
      if(i<m && j<n){
        best=Math.min(best,(al[i]===bl[j]?0:1)+dp[i+1][j+1]);
      }
      // 入力の余分な文字は、入力文字数が正解より多い場合だけ赤で削除。
      if(longer && i<m) best=Math.min(best,1+dp[i+1][j]);
      // 足りない文字は、入力文字数が正解より少ない場合だけ緑で追加。
      if(shorter && j<n) best=Math.min(best,1+dp[i][j+1]);
      dp[i][j]=best;
    }
  }

  let out="",i=0,j=0;
  while(i<m || j<n){
    if(i<m && j<n && al[i]===bl[j] && dp[i][j]===dp[i+1][j+1]){
      out+=`<span class="same">${escape(a[i])}</span>`; i++; j++; continue;
    }
    if(i<m && j<n && dp[i][j]===1+dp[i+1][j+1]){
      out+=`<span class="wrong">${escape(a[i])}</span>`; i++; j++; continue;
    }
    if(longer && i<m && dp[i][j]===1+dp[i+1][j]){
      out+=`<span class="wrong">${escape(a[i])}</span>`; i++; continue;
    }
    if(shorter && j<n && dp[i][j]===1+dp[i][j+1]){
      out+=`<span class="missing">${escape(b[j])}</span>`; j++; continue;
    }
    // 念のための終端処理。
    if(i<m){out+=`<span class="wrong">${escape(a[i])}</span>`;i++;}
    else if(j<n){out+=`<span class="missing">${escape(b[j])}</span>`;j++;}
  }
  return out || `<span class="same">${escape(b)}</span>`;
}

function csvParse(str){
  const out=[];let row=[],cell="",q=false;
  for(let i=0;i<str.length;i++){const c=str[i],n=str[i+1];if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}if(c=='"'){q=!q;continue}if(c==','&&!q){row.push(cell);cell="";continue}if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell);out.push(row);row=[];cell="";continue}cell+=c}row.push(cell);if(row.length>1||row[0])out.push(row);return out;
}

      <div class="field" style="margin-top:10px"><label>パスワード</label><input id="authPass" type="password" autocomplete="current-password" style="width:100%"></div>
      <div class="dataActions">
        <button id="authLogin" class="primary">ログイン</button>
        <button id="authSignup" class="secondary">新規登録</button>
      </div>
      <div id="authMsg" class="muted" style="margin-top:10px"></div>
    </div></div>`;
  document.body.appendChild(div);
  document.getElementById("authClose").onclick=()=>div.remove();
  async function go(type){
    const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPass").value;
    if(!email||!password){document.getElementById("authMsg").textContent="メールアドレスとパスワードを入力してください。";return}
    const msg=document.getElementById("authMsg");msg.textContent="処理中…";
    try{
      const data=await authFetch(type==="login"?"token?grant_type=password":"signup",{email,password});
      if(type==="login"&&data.access_token){
        authSave(data); await cloudLoadStats(); await migrateGuestToCloud(); msg.textContent="ログインしました。"; setTimeout(()=>{div.remove();updateLoginButton()},500);
      }else if(type==="signup"){
        msg.textContent=data.access_token?"登録・ログインしました。":"登録しました。メール確認が必要な場合があります。";
        if(data.access_token){authSave(data);await cloudLoadStats();await migrateGuestToCloud();updateLoginButton()}
      }
    }catch(e){msg.textContent=e.message}
  }
  document.getElementById("authLogin").onclick=()=>go("login");
  document.getElementById("authSignup").onclick=()=>go("signup");
}
function updateLoginButton(){
  const b=document.getElementById("loginBtn");
  if(!b)return;
  if(auth?.access_token){b.textContent="ログアウト";b.onclick=async()=>{authClear();b.textContent="ログイン";b.onclick=authModal;render()}}
  else {b.textContent="ログイン";b.onclick=authModal}
}

document.getElementById("navQuiz").onclick=()=>{showScreen("quiz");renderQuiz()};
document.getElementById("navBook").onclick=()=>{showScreen("book");renderBook()};
document.getElementById("themeBtn").onclick=()=>{const d=document.documentElement,t=d.dataset.theme==="dark"?"":"dark";d.dataset.theme=t;localStorage.setItem(THEME,t);document.getElementById("themeBtn").textContent=t?"☀":"☾"};
document.getElementById("loginBtn").onclick=authModal;
if(localStorage.getItem(THEME)==="dark"){document.documentElement.dataset.theme="dark";document.getElementById("themeBtn").textContent="☀"}
updateLoginButton();
if(auth?.access_token) cloudLoadStats().then(()=>render()).catch(()=>render()); else render();
document.addEventListener("keydown",e=>{
  // Result screen shortcuts: Enter starts mistake review, Escape returns to settings.
  if(quiz && quiz.ended && !quiz.active){
    const review=document.getElementById("reviewBtn"), back=document.getElementById("backBtn");
    if(e.key==="Enter" && review){e.preventDefault();review.click();return}
    if(e.key==="Escape" && back){e.preventDefault();back.click();return}
    return;
  }
  if(!quiz||!quiz.active){
    const start=document.getElementById("startBtn");
    const tag=(e.target&&e.target.tagName)||"";
    if(start&&e.key==="Enter"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(tag)){e.preventDefault();start.click();}
    return;
  }
  // Escape ends a live quiz. Space is intentionally left free for spelling input.
  if(e.key==="Escape"){e.preventDefault();quiz=null;renderQuiz();return}
  if(quiz.answered){if(e.key==="Enter"){e.preventDefault();if(quiz.review){quiz.index++;quiz.answered=false;renderReview()}else nextQuestion()}return;}
  if(["1","2","3","4"].includes(e.key)&&quiz.currentMode!=="spell"){const i=+e.key-1;if(quiz.choices?.[i])checkAnswer(i,false);}
  if(e.key==="5"&&quiz.currentMode!=="spell"){e.preventDefault();checkAnswer(4,true)}
});
