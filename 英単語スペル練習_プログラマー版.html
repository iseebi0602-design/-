<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英単語スペル練習</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;display:flex;justify-content:center;padding:24px 14px}.app{width:min(680px,100%)}.card{background:white;border-radius:22px;padding:24px;box-shadow:0 12px 35px #0001}.top{display:flex;justify-content:space-between;margin-bottom:14px;font-weight:800}.muted{color:#64748b;font-size:13px}.meta{display:flex;justify-content:space-between;color:#64748b;font-size:14px}.bar{height:8px;background:#e5e7eb;border-radius:9px;margin:14px 0 24px;overflow:hidden}.fill{height:100%;background:#4f46e5;width:0;transition:.2s}.label{font-size:13px;color:#64748b}.question{font-size:32px;font-weight:800;margin:7px 0 24px;min-height:44px}.input{width:100%;padding:15px;border:2px solid #d1d5db;border-radius:13px;font-size:22px;outline:none}.input:focus{border-color:#4f46e5}.buttons{display:flex;gap:10px;margin-top:13px}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:800;font-size:16px;cursor:pointer}.primary{background:#4f46e5;color:white;flex:1}.secondary{background:#e5e7eb}.btn:disabled{opacity:.45}.feedback{margin-top:15px;padding:14px;border-radius:13px;min-height:62px}.good{background:#ecfdf5;color:#065f46}.bad{background:#fef2f2;color:#991b1b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#f8fafc;padding:10px;text-align:center;border-radius:11px}.stat b{display:block;font-size:20px}.hidden{display:none}.result{text-align:center}.score{font-size:52px;font-weight:900}@media(max-width:500px){.question{font-size:27px}.buttons{flex-direction:column}.btn{width:100%}}</style></head><body><main class="app"><div class="top"><span>英単語スペル練習</span><span class="muted">50問・内蔵</span></div><section class="card" id="quiz"><div class="meta"><span id="count"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="label">問題</div><div class="question" id="question">読み込み中…</div><div class="label">スペリングを入力</div><input id="input" class="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英語のスペルを入力"><div class="buttons"><button id="check" class="btn primary">答え合わせ</button><button id="next" class="btn secondary" disabled>次の問題</button></div><div id="feedback" class="feedback">答えを入力してください。</div><div class="stats"><div class="stat"><b id="correct">0</b>正解</div><div class="stat"><b id="wrong">0</b>不正解</div><div class="stat"><b id="streak">0</b>連続正解</div></div></section><section class="card result hidden" id="result"><h2>終了！</h2><div class="score" id="final"></div><p id="rate"></p><button id="retry" class="btn primary">もう一度挑戦</button></section></main><script>
'use strict';
const WORDS=[{"ja": "賛成する", "en": "agree"}, {"ja": "〜に反対する", "en": "oppose"}, {"ja": "〜に忠告する", "en": "advise"}, {"ja": "助言、ヒント", "en": "tip"}, {"ja": "〜について話し合う、議論する", "en": "discuss"}, {"ja": "〜に責任があるとする", "en": "blame"}, {"ja": "（thatS V）〜と主張する", "en": "argue"}, {"ja": "（thatS V/to do）〜と主張する", "en": "claim"}, {"ja": "文句を言う、苦情を言う", "en": "complain"}, {"ja": "〜を申し出る", "en": "offer"}, {"ja": "〜を示唆する", "en": "suggest"}, {"ja": "〜を推薦する", "en": "recommend"}, {"ja": "感謝している", "en": "grateful"}, {"ja": "謝る", "en": "apologize"}, {"ja": "言い訳", "en": "excuse"}, {"ja": "（特別な日、出来事）を祝う", "en": "celebrate"}, {"ja": "（人）を祝う", "en": "congratulate"}, {"ja": "〜を称賛する", "en": "admire"}, {"ja": "〜に感銘を与える", "en": "impress"}, {"ja": "賞", "en": "award"}, {"ja": "〜を説明する（e）", "en": "explain"}, {"ja": "〜を説明する（d）", "en": "describe"}, {"ja": "意思の疎通をはかる、〜を伝える", "en": "communicate"}, {"ja": "を表現する", "en": "express"}, {"ja": "約束", "en": "promise"}, {"ja": "情報", "en": "information"}, {"ja": "技術", "en": "technology"}, {"ja": "研究", "en": "research"}, {"ja": "材料", "en": "material"}, {"ja": "人工的な", "en": "artificial"}, {"ja": "電気の", "en": "electric"}, {"ja": "〜を発明する", "en": "invent"}, {"ja": "〜を発見する", "en": "discover"}, {"ja": "発達する", "en": "develop"}, {"ja": "技術", "en": "skill"}, {"ja": "能力", "en": "ability"}, {"ja": "才能", "en": "talent"}, {"ja": "努力", "en": "effort"}, {"ja": "練習", "en": "practice"}, {"ja": "〜を達成する", "en": "achieve"}, {"ja": "何とかして〜する", "en": "manage"}, {"ja": "〜を改善する", "en": "improve"}, {"ja": "〜を生産する", "en": "produce"}, {"ja": "〜を創造する", "en": "create"}, {"ja": "〜を確立する", "en": "establish"}, {"ja": "〜を形成する", "en": "form"}, {"ja": "を省く", "en": "save"}, {"ja": "薬", "en": "medicine"}, {"ja": "患者", "en": "patient"}, {"ja": "状態、容態", "en": "condiction"}];
const S={order:[],i:0,correct:0,wrong:0,streak:0,checked:false};
const el=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function current(){return WORDS[S.order[S.i]]}
function draw(){const w=current();el('count').textContent=`第 ${S.i+1} 問 / ${WORDS.length} 問`;el('score').textContent=`正解 ${S.correct} / ${WORDS.length}`;el('fill').style.width=`${S.i/WORDS.length*100}%`;el('question').textContent=w.ja;el('input').value='';el('input').disabled=false;el('input').focus();el('check').disabled=false;el('next').disabled=true;el('feedback').className='feedback';el('feedback').textContent='答えを入力してください。';S.checked=false;stats()}
function stats(){el('correct').textContent=S.correct;el('wrong').textContent=S.wrong;el('streak').textContent=S.streak}
function check(){if(S.checked)return;const v=el('input').value.trim().toLowerCase();if(!v){el('feedback').className='feedback bad';el('feedback').textContent='スペルを入力してください。';return}const ok=v===current().en.trim().toLowerCase();S.checked=true;el('input').disabled=true;el('check').disabled=true;el('next').disabled=false;if(ok){S.correct++;S.streak++;el('feedback').className='feedback good';el('feedback').textContent='正解！'}else{S.wrong++;S.streak=0;el('feedback').className='feedback bad';el('feedback').innerHTML='不正解。正しいスペル：<strong>'+current().en+'</strong>'}stats();el('score').textContent=`正解 ${S.correct} / ${WORDS.length}`}
function next(){if(!S.checked)return;if(S.i===WORDS.length-1){finish();return}S.i++;draw()}
function finish(){el('quiz').classList.add('hidden');el('result').classList.remove('hidden');el('final').textContent=`${S.correct} / ${WORDS.length}`;el('rate').textContent=`正解率 ${Math.round(S.correct/WORDS.length*100)}%`}
function start(){S.order=shuffle(Array.from({length:WORDS.length},(_,i)=>i));S.i=0;S.correct=0;S.wrong=0;S.streak=0;el('quiz').classList.remove('hidden');el('result').classList.add('hidden');draw()}
el('check').onclick=check;el('next').onclick=next;el('retry').onclick=start;el('input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();S.checked?next():check()}};start();
</script></body></html>
