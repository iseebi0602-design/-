<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英単語スペル練習</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#111827}.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}h1{font-size:25px;text-align:center;margin:8px 0 18px}.panel{background:white;border-radius:18px;padding:20px;box-shadow:0 4px 18px #00000012;margin-bottom:14px}button{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:700;background:#111827;color:white;cursor:pointer}button:active{transform:scale(.99)}button.secondary{background:#e5e7eb;color:#111827}button:disabled{opacity:.45;cursor:not-allowed}#home{text-align:center}.count{font-size:15px;color:#6b7280;margin-bottom:18px}#quiz{display:none}.top{display:flex;justify-content:space-between;color:#6b7280;font-size:14px;margin-bottom:18px}.jp{font-size:32px;font-weight:800;text-align:center;padding:35px 10px 30px;min-height:120px;display:flex;align-items:center;justify-content:center}input{width:100%;padding:15px;border:2px solid #d1d5db;border-radius:12px;font-size:20px;outline:none}input:focus{border-color:#111827}.feedback{min-height:60px;margin-top:15px;border-radius:12px;padding:13px;font-size:17px;font-weight:700;text-align:center;display:none}.ok{background:#dcfce7;color:#166534}.ng{background:#fee2e2;color:#991b1b}.answer{font-size:15px;font-weight:500;margin-top:6px}.stats{display:flex;gap:8px;margin-top:12px}.stat{flex:1;background:#f3f4f6;border-radius:10px;text-align:center;padding:9px;font-size:13px}.stat b{display:block;font-size:20px}#result{display:none;text-align:center}.score{font-size:42px;font-weight:900;margin:15px}.small{color:#6b7280;font-size:13px}</style></head><body><main class="wrap"><h1>英単語スペル練習</h1><section id="home" class="panel"><div class="count">50問を内蔵済み。読み込み操作は不要。</div><button id="start">問題を開始する</button></section><section id="quiz" class="panel"><div class="top"><span id="num"></span><span id="remain"></span></div><div id="jp" class="jp"></div><input id="ans" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英単語を入力"><div style="height:12px"></div><button id="judge">判定する</button><div id="feedback" class="feedback"></div><div style="height:10px"></div><button id="next" class="secondary" style="display:none">次の問題</button><div class="stats"><div class="stat">正解<b id="correct">0</b></div><div class="stat">不正解<b id="wrong">0</b></div><div class="stat">連続正解<b id="streak">0</b></div></div></section><section id="result" class="panel"><h2>終了！</h2><div class="score" id="score"></div><div id="detail" class="small"></div><div style="height:16px"></div><button id="retry">もう一度やる</button></section></main><script>
const WORDS=[{"ja": "賛成する", "en": "agree"}, {"ja": "〜に反対する", "en": "oppose"}, {"ja": "〜に忠告する", "en": "advise"}, {"ja": "助言、ヒント", "en": "tip"}, {"ja": "〜について話し合う、議論する", "en": "discuss"}, {"ja": "〜に責任があるとする", "en": "blame"}, {"ja": "（thatS V）〜と主張する", "en": "argue"}, {"ja": "（thatS V/to do）〜と主張する", "en": "claim"}, {"ja": "文句を言う、苦情を言う", "en": "complain"}, {"ja": "〜を申し出る", "en": "offer"}, {"ja": "〜を示唆する", "en": "suggest"}, {"ja": "〜を推薦する", "en": "recommend"}, {"ja": "感謝している", "en": "grateful"}, {"ja": "謝る", "en": "apologize"}, {"ja": "言い訳", "en": "excuse"}, {"ja": "（特別な日、出来事）を祝う", "en": "celebrate"}, {"ja": "（人）を祝う", "en": "congratulate"}, {"ja": "〜を称賛する", "en": "admire"}, {"ja": "〜に感銘を与える", "en": "impress"}, {"ja": "賞", "en": "award"}, {"ja": "〜を説明する（e）", "en": "explain"}, {"ja": "〜を説明する（d）", "en": "describe"}, {"ja": "意思の疎通をはかる、〜を伝える", "en": "communicate"}, {"ja": "を表現する", "en": "express"}, {"ja": "約束", "en": "promise"}, {"ja": "情報", "en": "information"}, {"ja": "技術", "en": "technology"}, {"ja": "研究", "en": "research"}, {"ja": "材料", "en": "material"}, {"ja": "人工的な", "en": "artificial"}, {"ja": "電気の", "en": "electric"}, {"ja": "〜を発明する", "en": "invent"}, {"ja": "〜を発見する", "en": "discover"}, {"ja": "発達する", "en": "develop"}, {"ja": "技術", "en": "skill"}, {"ja": "能力", "en": "ability"}, {"ja": "才能", "en": "talent"}, {"ja": "努力", "en": "effort"}, {"ja": "練習", "en": "practice"}, {"ja": "〜を達成する", "en": "achieve"}, {"ja": "何とかして〜する", "en": "manage"}, {"ja": "〜を改善する", "en": "improve"}, {"ja": "〜を生産する", "en": "produce"}, {"ja": "〜を創造する", "en": "create"}, {"ja": "〜を確立する", "en": "establish"}, {"ja": "〜を形成する", "en": "form"}, {"ja": "を省く", "en": "save"}, {"ja": "薬", "en": "medicine"}, {"ja": "患者", "en": "patient"}, {"ja": "状態、容態", "en": "condiction"}];
let quiz=[],idx=0,correct=0,wrong=0,streak=0,judged=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){quiz=shuffle(WORDS);idx=0;correct=0;wrong=0;streak=0;$('home').style.display='none';$('result').style.display='none';$('quiz').style.display='block';show();}
function show(){judged=false;const w=quiz[idx];$('num').textContent=`第 ${idx+1} 問 / ${quiz.length} 問`;$('remain').textContent=`残り ${quiz.length-idx} 問`;$('jp').textContent=w.ja;$('ans').value='';$('ans').disabled=false;$('judge').style.display='block';$('judge').disabled=false;$('next').style.display='none';$('feedback').style.display='none';$('feedback').textContent='';$('ans').focus();update();}
function judge(){if(judged)return;const typed=$('ans').value.trim();if(!typed)return;judged=true;const w=quiz[idx];if(typed.toLowerCase()===w.en.toLowerCase()){correct++;streak++;$('feedback').className='feedback ok';$('feedback').innerHTML='正解！';}else{wrong++;streak=0;$('feedback').className='feedback ng';$('feedback').innerHTML=`不正解<br><span class="answer">正解：${w.en}</span>`;}$('feedback').style.display='block';$('judge').disabled=true;$('ans').disabled=true;$('next').style.display='block';update();}
function next(){if(!judged)return;if(idx<quiz.length-1){idx++;show();}else{finish();}}
function finish(){$('quiz').style.display='none';$('result').style.display='block';$('score').textContent=`${correct} / ${quiz.length}`;$('detail').textContent=`正解 ${correct}問・不正解 ${wrong}問`;}
function update(){$('correct').textContent=correct;$('wrong').textContent=wrong;$('streak').textContent=streak;}
$('start').addEventListener('click',start);$('judge').addEventListener('click',judge);$('next').addEventListener('click',next);$('retry').addEventListener('click',start);$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!judged)judge();else next();}});
</script></body></html>
