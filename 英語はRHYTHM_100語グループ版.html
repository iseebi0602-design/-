<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語はRHYTHM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:24px}
.card{background:white;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 5px 20px #0000000d}
h1{margin:0 0 8px;font-size:28px}.muted{color:#667085}
input,select,button{font:inherit;padding:11px 13px;border:1px solid #d0d5dd;border-radius:10px}
input,select{width:100%;margin:6px 0 12px}button{cursor:pointer;background:#111827;color:white;border:0}
button.secondary{background:#eef2f7;color:#172033}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hidden{display:none}.big{font-size:34px;font-weight:700;text-align:center;margin:28px 0}
.jp{text-align:center;font-size:20px;margin:12px}.msg{text-align:center;min-height:28px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:130px}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.groupNote{font-size:13px;color:#667085;margin-top:-4px;margin-bottom:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:14px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>英語はRHYTHM</h1>
    <div class="muted">LEAP英単語を、スペル・日本語5択・英語5択で練習できます。</div>
  </div>

  <section id="auth" class="card">
    <h2>ログイン / 新規登録</h2>
    <label>メールアドレス</label>
    <input id="email" type="email" autocomplete="email">
    <label>パスワード</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions">
      <button id="signup">新規登録</button>
      <button id="login">ログイン</button>
    </div>
    <p id="authMsg" class="msg"></p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="actions">
        <button class="secondary" id="logout">ログアウト</button>
      </div>
      <p id="userInfo" class="muted"></p>
    </div>

    <div class="card">
      <h2>単語データ</h2>
      <p class="muted">Leap単語帳.csvを標準データとして使えます。別のCSVに変更することもできます。</p>
      <input id="csv" type="file" accept=".csv,text/csv">
      <p id="csvMsg" class="msg"></p>
      <label>100語グループ</label>
      <select id="group">
        <option value="all">すべて</option>
      </select>
    </div>

    <div class="card">
      <h2>出題設定</h2>
      <div class="row">
        <div><label>開始番号</label><input id="start" type="number" value="1" min="1"></div>
        <div><label>終了番号</label><input id="end" type="number" value="200" min="1"></div>
      </div>
      <div class="row">
        <div><label>問題数</label><input id="count" type="number" value="20" min="1"></div>
        <div><label>モード</label>
          <select id="mode">
            <option value="normal">通常</option>
            <option value="spell">スペル入力</option>
            <option value="jp5">日本語5択</option>
            <option value="en5">英語5択</option>
            <option value="weak">苦手集中</option>
            <option value="recent">最近間違えた単語</option>
            <option value="unknown">未習得優先</option>
          </select>
        </div>
      </div>
      <div id="weakBox"><label>苦手判定：正答率がこの値未満</label><input id="weak" type="number" value="70" min="0" max="100"></div>
      <button id="startQuiz">出題開始</button>
    </div>

    <div id="quiz" class="card hidden">
      <div class="muted" id="progress"></div>
      <div class="big" id="question"></div>
      <div class="jp" id="meaning"></div>
      <div id="choices" class="actions hidden"></div>
      <input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英単語を入力">
      <div class="actions"><button id="check">答え合わせ</button><button class="secondary" id="next">次の問題</button></div>
      <p id="result" class="msg"></p>
      <div id="explanation" class="card hidden"></div>
    </div>

    <div id="summary" class="card hidden"></div>
  </section>
</div>

<script>
const SUPABASE_URL = "https://rxbzpbpgtobwyrvlrvgk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fSAK1aeplM9tW_YQKD9c3Q_ujspntUw";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let words=[], queue=[], pos=0, checked=false, sessionCorrect=0, sessionWrong=0, current=null;

const $=id=>document.getElementById(id);
function msg(el,t){el.textContent=t}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

$("signup").onclick=async()=>{
  const email=$("email").value.trim(), password=$("password").value;
  if(!email||!password){msg($("authMsg"),"メールアドレスとパスワードを入力してください");return}
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){msg($("authMsg"),error.message);return}
  msg($("authMsg"),data.session?"登録しました":"確認メールが届いたら、メール内のリンクで確認してください。");
};

$("login").onclick=async()=>{
  const email=$("email").value.trim(), password=$("password").value;
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error){msg($("authMsg"),error.message);return}
  showApp(data.user);
};

$("logout").onclick=async()=>{await supabaseClient.auth.signOut();showAuth()};

function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden")}
function showApp(user){
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");
  $("userInfo").textContent="ログイン中："+user.email;
}
supabaseClient.auth.getSession().then(({data})=>{if(data.session)showApp(data.session.user);else showAuth()});
supabaseClient.auth.onAuthStateChange((_e,s)=>{if(s)showApp(s.user);else showAuth()});

function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){
      if(q && text[i+1]==='"'){cell+='"';i++} else q=!q;
    }else if(c===","&&!q){row.push(cell);cell=""}
    else if((c==="\n"||c==="\r")&&!q){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(cell);cell="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    }else cell+=c;
  }
  row.push(cell); if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}

function rebuildGroups(){
  const sel=$("group");
  sel.innerHTML='<option value="all">すべて</option>';
  if(!words.length)return;
  const max=Math.max(...words.map(w=>w.no));
  for(let start=1;start<=max;start+=100){
    const end=Math.min(start+99,max);
    const n=words.filter(w=>w.no>=start&&w.no<=end).length;
    if(n)sel.insertAdjacentHTML("beforeend",`<option value="${start}-${end}">${start}〜${end}（${n}語）</option>`);
  }
}
function applyGroup(){
  const v=$("group").value;
  if(v==="all")return;
  const [a,b]=v.split("-").map(Number);
  $("start").value=a;
  $("end").value=b;
}
$("group").onchange=applyGroup;

async function loadCSVText(rawText, label="CSV"){
  const rows=parseCSV(rawText);
  words=rows.map((r,i)=>{
    // Supports the current Leap CSV layout: number, English, Japanese, explanation.
    // Also tolerates the previously documented number, Japanese, English, explanation layout.
    let no=Number(r[0]||i+1), a=(r[1]||"").trim(), b=(r[2]||"").trim(), exp=(r[3]||"").trim();
    const looksEnglish=s=>/^[A-Za-z][A-Za-z' -]*$/.test(s);
    const en=looksEnglish(a)?a:(looksEnglish(b)?b:"");
    const jp=en===a?b:a;
    return {no,jp,en,exp};
  }).filter(w=>w.en);
  localStorage.setItem("leap_words_csv", rawText);
  localStorage.setItem("leap_words_name", label);
  rebuildGroups();
  msg($("csvMsg"),words.length+"語を読み込みました");
}
$("csv").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  await loadCSVText(await f.text(),f.name);
};
(async()=>{
  const saved=localStorage.getItem("leap_words_csv");
  if(saved) await loadCSVText(saved,localStorage.getItem("leap_words_name")||"保存済みCSV");
})();

async function getStats(no){
  const {data,error}=await supabaseClient.from("word_stats").select("*").eq("word_no",no).maybeSingle();
  return error?null:data;
}
async function saveStats(no,correct){
  const {data:{user}}=await supabaseClient.auth.getUser(); if(!user)return;
  const old=await getStats(no);
  const c=(old?.correct||0)+(correct?1:0), w=(old?.wrong||0)+(correct?0:1);
  await supabaseClient.from("word_stats").upsert({
    user_id:user.id,word_no:no,correct:c,wrong:w,total:c+w,
    last_wrong:correct?(old?.last_wrong||null):new Date().toISOString(),
    updated_at:new Date().toISOString()
  },{onConflict:"user_id,word_no"});
}

async function buildQueue(){
  applyGroup();
  const start=Number($("start").value), end=Number($("end").value);
  let pool=words.filter(w=>w.no>=start&&w.no<=end);
  const mode=$("mode").value;
  if(mode==="weak"){
    const threshold=Number($("weak").value);
    const arr=[];
    for(const w of pool){const s=await getStats(w.no);const rate=s&&s.total?s.correct/s.total*100:0;if(rate<threshold)arr.push(w)}
    pool=arr.length?arr:pool;
  }else if(mode==="recent"){
    const arr=[];
    for(const w of pool){const s=await getStats(w.no);if(s?.last_wrong)arr.push({w,t:new Date(s.last_wrong).getTime()})}
    pool=arr.sort((a,b)=>b.t-a.t).map(x=>x.w);
  }else if(mode==="unknown"){
    const arr=[];
    for(const w of pool){const s=await getStats(w.no);if(!s||!s.total||s.correct/s.total<1)arr.push(w)}
    pool=arr.length?arr:pool;
  }
  pool.sort(()=>Math.random()-.5);
  return pool.slice(0,Math.min(Number($("count").value),pool.length));
}

$("startQuiz").onclick=async()=>{
  if(!words.length){alert("先にCSVを読み込んでください");return}
  queue=await buildQueue(); if(!queue.length){alert("条件に合う問題がありません");return}
  pos=0;sessionCorrect=0;sessionWrong=0;$("summary").classList.add("hidden");$("quiz").classList.remove("hidden");showQuestion();
};

function showQuestion(){
  current=queue[pos];checked=false;
  $("progress").textContent=`${pos+1} / ${queue.length}`;
  $("question").textContent=current.jp;
  $("meaning").textContent="";
  $("choices").classList.add("hidden");
  $("choices").innerHTML="";
  $("answer").classList.remove("hidden");
  $("answer").disabled=false;
  $("answer").value="";
  $("answer").placeholder="英単語を入力";
  $("check").classList.remove("hidden");
  $("next").classList.remove("hidden");
  $("result").textContent="";
  $("explanation").classList.add("hidden");

  const mode=$("mode").value;
  if(mode==="jp5" || mode==="en5"){
    $("answer").classList.add("hidden");
    $("check").classList.add("hidden");
    $("choices").classList.remove("hidden");
    $("question").textContent = mode==="jp5" ? current.en : current.jp;

    const pool=words.filter(w=>w.no!==current.no);
    const shuffled=pool.sort(()=>Math.random()-.5).slice(0,4);
    const choices = mode==="jp5"
      ? [current.jp,...shuffled.map(w=>w.jp)]
      : [current.en,...shuffled.map(w=>w.en)];
    choices.sort(()=>Math.random()-.5).forEach(choice=>{
      const b=document.createElement("button");
      b.textContent=choice;
      b.onclick=()=>checkChoice(choice,mode);
      $("choices").appendChild(b);
    });
  } else {
    $("answer").focus();
  }
}

async function checkChoice(choice,mode){
  if(checked)return;
  checked=true;
  const ok=choice.toLowerCase()===((mode==="jp5"?current.jp:current.en)||"").toLowerCase();
  $("choices").querySelectorAll("button").forEach(b=>b.disabled=true);
  if(ok){sessionCorrect++;msg($("result"),"正解！")}
  else{sessionWrong++;msg($("result"),`不正解。正解：${mode==="jp5"?current.jp:current.en}`)}
  $("explanation").innerHTML=`<b>解説</b><br>${esc(current.exp||"解説なし")}`;
  $("explanation").classList.remove("hidden");
  await saveStats(current.no,ok);
}

async function checkAnswer(){
  if(checked)return;
  checked=true;$("answer").disabled=true;
  const ok=$("answer").value.trim().toLowerCase()===current.en.toLowerCase();
  if(ok){sessionCorrect++;msg($("result"),"正解！")}
  else{sessionWrong++;msg($("result"),`不正解。正解：${current.en}`)}
  $("explanation").innerHTML=`<b>解説</b><br>${esc(current.exp||"解説なし")}`;
  $("explanation").classList.remove("hidden");
  await saveStats(current.no,ok);
}

$("check").onclick=checkAnswer;
$("next").onclick=()=>{
  if(!checked){checkAnswer();return}
  pos++;
  if(pos>=queue.length){
    $("quiz").classList.add("hidden");$("summary").classList.remove("hidden");
    $("summary").innerHTML=`<h2>結果</h2><div class="stat"><span>正解</span><b>${sessionCorrect}</b></div><div class="stat"><span>不正解</span><b>${sessionWrong}</b></div><div class="stat"><span>正答率</span><b>${Math.round(sessionCorrect/queue.length*100)}%</b></div>`;
  }else showQuestion();
};
$("answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();if(checked)$("next").click();else checkAnswer()}
});
</script>
</body>
</html>
